name: Vibe render (3D pattern-pipeline check)

# Runs the 3D massing "vibe test" (scripts/vibe-render.sh) on every PR and
# uploads the resulting PNG/SVG renders as a downloadable Actions artifact,
# so a reviewer can eyeball scale/density/fragmentation before merging
# without running cadquery/OpenCascade locally. Separate from deploy.yml
# on purpose -- this never touches the live site or its deploy credentials,
# it only runs read-only against fixture data and uploads files.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vibe-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run vibe-render
        run: scripts/vibe-render.sh

      - name: Visual regression check (isometric renders)
        # HARDENING_SPEC.md §4 -- perceptual-hash gate, not just a human
        # eyeball on the uploaded artifact below. Determinism confirmed
        # separately before this was built (see PR history): the isometric
        # PNG is byte-identical across repeat runs on identical input,
        # unlike the SVG/.glb outputs (cosmetic-only non-determinism --
        # embedded timestamp, randomized ids -- not gated here yet).
        # A PR that intentionally changes a render updates the baseline
        # with: python3 tools/vibe-render/perceptual_hash.py update-baseline
        # tools/vibe-render/baselines/isometric.json target/vibe-render
        # clean_baseline_isometric.png barrio_mallcore_isometric.png
        # mallcore_seeding_stratified_isometric.png mallcore_seeding_fieldguided_isometric.png
        run: |
          tools/vibe-render/.venv/bin/python3 tools/vibe-render/perceptual_hash.py check \
            tools/vibe-render/baselines/isometric.json \
            target/vibe-render

      - name: Upload vibe-render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibe-render-${{ github.event.pull_request.number || github.sha }}
          path: |
            target/vibe-render/*.png
            target/vibe-render/*.svg
          if-no-files-found: error
          retention-days: 30
