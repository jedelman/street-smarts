name: Build and deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node (for the EC fixture converter)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: cargo test --workspace --release

      - name: Build WASM
        run: |
          wasm-pack build crates/street-smarts-web \
            --target web --release \
            --out-dir ../../public/pkg
          rm -f public/pkg/.gitignore

      - name: Verify required outputs
        run: |
          test -f public/index.html
          test -f public/pkg/street_smarts_web.js
          test -f public/pkg/street_smarts_web_bg.wasm
          test -f public/data/eastside-baseline.json
          test -f public/data/eastside-proposal.json
          echo "All required outputs present."

      - name: Bundle size
        run: |
          echo "WASM raw   : $(stat -c%s public/pkg/street_smarts_web_bg.wasm) bytes"
          echo "WASM gzip  : $(gzip -c public/pkg/street_smarts_web_bg.wasm | wc -c) bytes"

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: |
          rm -rf .wrangler/tmp 2>/dev/null || true
          npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Ghent canopy microsite to Cloudflare Pages
        run: |
          npx -y wrangler@4 pages deploy tools/canopy-loss/site \
            --project-name=ghent-canopy \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
