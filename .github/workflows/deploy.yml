name: Build and deploy to Cloudflare

# Production (push to main) deploys to the live Worker (custom domain) AND
# to the Cloudflare Pages project's production branch. Every PR/branch
# build also deploys to Pages, which gives it its own unique preview URL
# (<hash>.street-smarts.pages.dev) with no effect on production traffic --
# the "Comment preview URL on the PR" step below posts/updates that link
# on the PR. The Workers deploy step stays main-only and untouched so the
# live site's custom domain keeps working exactly as before -- retiring it
# needs one manual step outside CI: re-pointing that custom domain to the
# Pages project in the Cloudflare dashboard.
#
# Also runs the 3D "vibe render" visual regression gate and uploads its
# renders as a downloadable artifact -- folded in from a formerly separate
# `vibe-render.yml` workflow, which ran `scripts/vibe-render.sh` a SECOND
# time on every PR (its own full Rust compile + cadquery render, paying
# real CI minutes twice for identical output). This job already runs
# vibe-render.sh once for the deploy itself; the old workflow's two steps
# below just read that SAME `target/vibe-render` output, no separate run
# needed. This also closes a real gap the split left open: the perceptual-
# hash check previously couldn't block a deploy at all (two independent
# workflows, neither gated on the other) -- a real visual regression could
# land on production as long as build-and-deploy itself stayed green. Now
# it's a real gate, same "gated, not just measured" standard as the bundle
# size budget below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node (for the EC fixture converter)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python (for the vibe-render gallery)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test
        run: cargo test --workspace --release

      - name: Build WASM
        run: |
          wasm-pack build crates/street-smarts-web \
            --target web --release \
            --out-dir ../../public/pkg
          rm -f public/pkg/.gitignore

      - name: Generate vibe-render gallery
        run: PUBLISH_DIR=public/vibe-render scripts/vibe-render.sh

      - name: Verify required outputs
        run: |
          test -f public/index.html
          test -f public/pkg/street_smarts_web.js
          test -f public/pkg/street_smarts_web_bg.wasm
          test -f public/data/eastside-baseline.json
          test -f public/data/eastside-proposal.json
          test -f public/vibe-render/clean_baseline_isometric.png
          test -f public/vibe-render/clean_baseline.glb
          test -f public/vibe-render/clean_baseline_floorplan_ground.svg
          test -f public/vibe-render/clean_baseline_floorplan_largest_building.svg
          test -f public/vibe-render/clean_baseline_lineage.svg
          test -f public/vibe-render/cluster_interior_isometric.png
          test -f public/vibe-render/cluster_interior.glb
          echo "All required outputs present."

      - name: Visual regression check (isometric renders)
        # HARDENING_SPEC.md §4 -- perceptual-hash gate, not just a human
        # eyeball on the uploaded artifact below. Determinism confirmed
        # separately before this was built (see PR history): the isometric
        # PNG is byte-identical across repeat runs on identical input,
        # unlike the SVG/.glb outputs (cosmetic-only non-determinism --
        # embedded timestamp, randomized ids -- not gated here yet).
        # A PR that intentionally changes a render updates the baseline
        # with: python3 tools/vibe-render/perceptual_hash.py update-baseline
        # tools/vibe-render/baselines/isometric.json target/vibe-render
        # clean_baseline_isometric.png cluster_interior_isometric.png
        # barrio_mallcore_isometric.png
        # mallcore_seeding_stratified_isometric.png mallcore_seeding_fieldguided_isometric.png
        #
        # Reads `target/vibe-render` -- the "Generate vibe-render gallery"
        # step above already populated it (its own $OUT_DIR default,
        # independent of PUBLISH_DIR=public/vibe-render), same directory
        # the old separate vibe-render.yml workflow re-derived from scratch.
        run: |
          tools/vibe-render/.venv/bin/python3 tools/vibe-render/perceptual_hash.py check \
            tools/vibe-render/baselines/isometric.json \
            target/vibe-render

      - name: Upload vibe-render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibe-render-${{ github.event.pull_request.number || github.sha }}
          path: |
            target/vibe-render/*.png
            target/vibe-render/*.svg
          if-no-files-found: error
          retention-days: 30

      - name: Bundle size budget
        # Gated, not just measured -- see HARDENING_SPEC.md §2 and
        # IMPLEMENTATION_PLAN.md Phase 2. Budget seeded from the real
        # measured gzip size as of that spec's writing (199,599 bytes,
        # with wasm-opt left off -- see web/Cargo.toml's own comment on
        # why) plus real headroom, not an arbitrary round number. SPEC.md
        # §3.5's hard ceiling is 5MB compressed; this is deliberately much
        # tighter since the real number is known. Ratchet down over time
        # as real headroom data accumulates -- don't just raise it if it's
        # ever hit without asking why the bundle grew first.
        run: |
          RAW=$(stat -c%s public/pkg/street_smarts_web_bg.wasm)
          GZIP=$(gzip -c public/pkg/street_smarts_web_bg.wasm | wc -c)
          BUDGET_GZIP_BYTES=300000
          echo "WASM raw   : ${RAW} bytes"
          echo "WASM gzip  : ${GZIP} bytes (budget: ${BUDGET_GZIP_BYTES} bytes)"
          if [ "$GZIP" -gt "$BUDGET_GZIP_BYTES" ]; then
            echo "::error::WASM gzip size ${GZIP} bytes exceeds budget of ${BUDGET_GZIP_BYTES} bytes"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers (production, main only)
        # Still the live site's custom domain until that's manually
        # re-pointed to the Pages project below -- see this workflow's
        # header comment. PRs never touch production.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        run: |
          rm -rf .wrangler/tmp 2>/dev/null || true
          npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create street-smarts Cloudflare Pages project (idempotent)
        run: |
          npx -y wrangler@4 pages project create street-smarts \
            --production-branch=main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview/production to Cloudflare Pages
        # Runs on every PR/branch build, not just main -- this is what
        # gives each branch its own preview URL. Plain `wrangler pages
        # deploy`, same as the Ghent canopy step below, not the
        # `cloudflare/pages-action` wrapper -- Cloudflare archived that
        # action in Oct 2024, so it's off the table for new CI. Wrangler
        # decides preview vs production from the branch name against the
        # project's production-branch (main, set above); its own stdout
        # reports the deployment URL either way, captured here for the PR
        # comment step below.
        id: pages-deploy
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          OUTPUT=$(npx -y wrangler@4 pages deploy public \
            --project-name=street-smarts \
            --branch="$BRANCH" \
            --commit-dirty=true 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request' && steps.pages-deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.pages-deploy.outputs.url }}";
            const marker = "<!-- cloudflare-pages-preview -->";
            const body = `${marker}\nPreview deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Deploy Ghent canopy microsite to Cloudflare Pages (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx -y wrangler@4 pages project create ghent-canopy \
            --production-branch=main 2>/dev/null || true
          npx -y wrangler@4 pages deploy tools/canopy-loss/site \
            --project-name=ghent-canopy \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
