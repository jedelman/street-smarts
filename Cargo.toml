# street-smarts — A Christopher Alexander provocation engine for neighborhood imagination
#
# Workspace structure:
#   street-smarts-core       — NIR schema, geometry primitives, common types
#   street-smarts-opinions   — geometric / pattern / activist opinion implementations
#   street-smarts-conflict   — disagreement detection between opinions
#   street-smarts-ledger     — decision ledger types (browser uses IndexedDB; this is the schema)
#   street-smarts-generator  — pattern operators, steering loop (stub in v0.1)
#   street-smarts-web        — WASM bindings + Cloudflare Worker handler
#
# v0.2+ will add ferrotorch as a dep for NN-based opinions and the steerable generator.
# v0.1 is classical geometric algorithms only.

[workspace]
resolver = "2"
members = [
    "crates/street-smarts-core",
    "crates/street-smarts-opinions",
    "crates/street-smarts-conflict",
    "crates/street-smarts-ledger",
    "crates/street-smarts-generator",
    "crates/street-smarts-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Jason Edelman <edelmanja@gmail.com>"]
repository = "https://github.com/jedelman/street-smarts"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

# Internal
street-smarts-core = { path = "crates/street-smarts-core" }
street-smarts-opinions = { path = "crates/street-smarts-opinions" }
street-smarts-conflict = { path = "crates/street-smarts-conflict" }
street-smarts-ledger = { path = "crates/street-smarts-ledger" }
street-smarts-generator = { path = "crates/street-smarts-generator" }

[profile.release]
opt-level = "z"     # optimize for size, WASM bundle constraint
lto = true
codegen-units = 1
strip = true
panic = "abort"
