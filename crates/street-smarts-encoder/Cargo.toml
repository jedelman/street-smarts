[package]
name = "street-smarts-encoder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Shared ViT encoder + DINO pretraining for street-smarts pattern probes"

[workspace]

[dependencies]
# ferrotorch lives in vendor/ferrotorch, cloned by hand. It was a git submodule
# (https://github.com/forecast-bio/ferrotorch, pinned at commit
# bb25b9c22ee2e333841fdd19861ebabae5502d32) until 2026-11-25, when that URL
# stopped being publicly fetchable and Cloudflare's builds, which always clone
# submodules, failed on it. This crate isn't a workspace member and nothing
# the site deploys uses it. To build it, clone ferrotorch at that commit into
# vendor/ferrotorch (from wherever it now lives).
ferrotorch-core = { path = "../../vendor/ferrotorch/ferrotorch-core" }
ferrotorch-nn = { path = "../../vendor/ferrotorch/ferrotorch-nn" }
ferrotorch-vision = { path = "../../vendor/ferrotorch/ferrotorch-vision" }
ferrotorch-optim = { path = "../../vendor/ferrotorch/ferrotorch-optim" }
ferrotorch-data = { path = "../../vendor/ferrotorch/ferrotorch-data" }
ferrotorch-gpu = { path = "../../vendor/ferrotorch/ferrotorch-gpu", features = ["cuda"], optional = true }
gdal = { version = "0.17", features = ["bindgen"], optional = true }
ureq = "2"

[features]
default = []
cuda = ["dep:ferrotorch-gpu"]
gdal = ["dep:gdal"]
